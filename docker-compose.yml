services:
  postgres:
    image: postgres:16-alpine
    container_name: aieo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aieo
      POSTGRES_PASSWORD: aieo
      POSTGRES_DB: aieo
    ports:
      - "5432:5432"
    volumes:
      - aieo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aieo -d aieo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aieo-postgres-data:
